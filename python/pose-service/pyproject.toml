[project]
name = "tryvora-pose-service"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "pillow>=11,<13",
  "numpy>=2,<3",
  "mediapipe>=0.10.30,<1",
  "httpx2>=2,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
